<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarkedExiled - Starting Soon</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/exiled.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/stream.css">
</head>

<body class="ss">

<svg class="mark-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <g id="exiledMark" transform="translate(0,600) scale(0.1,-0.1)" fill="currentColor" stroke="none">

      </g>
    </defs>
  </svg>

<!-- Fixed 1920x1080 stage, scaled to whatever it is dropped into. A
     broadcast graphic has to compose at exactly one size; scaling the
     whole stage keeps every proportion identical at 1080p, 720p or in a
     small preview window. -->
<div class="stage" id="stage">

  <span class="stage__grid" aria-hidden="true"></span>
  <span class="stage__scan" aria-hidden="true"></span>
  <span class="stage__roll" aria-hidden="true"></span>

  <!-- top left: the lockup, large enough to survive a downscale -->
  <div class="ss-brand">
    <svg class="ss-brand__mark" viewBox="0 0 600 600" aria-hidden="true"><use href="#exiledMark"/></svg>
    <div class="ss-brand__text">
      <p class="ss-brand__word glitch" data-text="MarkedExiled">MarkedExiled</p>
      <p class="ss-brand__sub">Media &amp; Entertainment</p>
    </div>
  </div>

  <!-- left: the terminal -->
  <section class="term">
    <div class="term__bar"><b>blackwall@markedexiled</b><b>// tty0</b></div>
    <div class="term__body" id="termBody"></div>
  </section>

  <!-- right: breach grids popping in and out -->
  <div class="ss-grids" id="ssGrids" aria-hidden="true"></div>

  <!-- centre: the card -->
  <div class="ss-card" id="ssCard">
    <div class="ss-card__bar"><b>0x4D45</b><span><i></i><i></i><i></i></span></div>
    <div class="ss-card__in">
      <p class="ss-card__eyebrow">Signal acquired</p>
      <h1 class="ss-card__title glitch" data-text="Starting Soon">Starting Soon</h1>
      <div class="ss-card__meter"><span id="ssMeter"></span></div>
    </div>
    <span class="tearlines" aria-hidden="true"></span>
  </div>

  <!-- bottom: decrypting byte streams -->
  <div class="ss-feed" id="ssFeed" aria-hidden="true"></div>

  <!-- the blackwall hit -->
  <div class="ss-tear" id="ssTear" aria-hidden="true">
    <span class="ss-tear__wash"></span>
    <span class="ss-tear__bars"></span>
    <div class="ss-tear__halves" id="ssHalves"></div>
    <span class="ss-tear__glow"></span>
  </div>

</div>

<script src="../js/site.js"></script>
<script src="../js/stream.js"></script>
</body>
</html>
